name: Train Weather Model

on:
  push:
    branches: [main]
    paths:
      - "train_weather_model.py"
      - "weather_model.py"
      - "requirements.txt"
      - ".github/workflows/train-weather-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn joblib requests
      - name: Train and evaluate model
        run: python train_weather_model.py --output weather_model.joblib
      - name: Publish model artifact to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f weather_model.joblib
          if git diff --cached --quiet; then
            echo "Model artifact is unchanged; no commit required."
          else
            git commit -m "chore: publish trained weather model [skip ci]"
            git push origin HEAD:main
          fi
